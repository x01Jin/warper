[package]
name = "warper"
version = "0.1.3"
description = "Tray app that cycles Cloudflare WARP exit IPs through warp-cli"
authors = ["x01Jin"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "warper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "time", "sync", "macros", "rt"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
windows = { version = "0.62.2", features = [
  "Win32_System_JobObjects",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.dev-release]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false
debug = "line-tables-only"
incremental = true
strip = false
